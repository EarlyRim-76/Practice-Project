# A reusable workflow
name: Reusable workflow
on: 
   workflow_call: # this will called by other workflow
    inputs: #Data of anytype
      artifact-name: #any name of your choice
        description: The name of the incomming input artifact #description of the incomming value 
        required: false 
        default: dist #if the artifact is empty, this is the value 
        type: string #value of the default 
    outputs: # outputs from use-reusable
      result: 
        description: The result of the deployment operation
        value: ${{ jobs.deploy.outputs.outcome }} #value of outputs
    # secrets:  #adding secrets, commented but this is the way to transfer secret
    #   some-secret: # name of secret
    #     required: false
jobs:
  deploy:
    outputs:
      outcome: ${{ steps.set-result.outputs.step-result }} # the result of output
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/download-artifact@v7
        with: 
          name: ${{ inputs.artifact-name  }}
      - name: list
        run: ls 
      - name: Output Information
        run: echo "Deploying & uploading..."
      - name: Set result output
        run: echo "step-result=success" >> $GITHUB_OUTPUT # The value comming from the output outcome
