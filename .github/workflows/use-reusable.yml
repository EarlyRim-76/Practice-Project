#Just replace the actions to latest versions
name: Using reusable workflow
on: workflow_dispatch
  # push:
  #   branches:
  #     - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.output.cache.hit != 'true' #this returns a string value
        run: npm ci
      - name: Lint code
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.output.cache.hit != 'true' #this returns a string value
        run: npm ci
      - name: Test code
        id: run-test #adding id
        run: npm run test
      - name: Upload test report
        if: failure() && steps.run-test.outcome == 'failure' #Conditional, with special condition functions
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: test.json
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.output.cache.hit != 'true' #this returns a string value
        run: npm ci
      - name: Build website
        id: build-website
        run: npm run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist-files
          path: dist
  deploy:
    needs: build
    uses: ./.github/workflow/reusable.yml #Adding directory to call another workflow from the directory
    with: # passing data to other workflow
      artifact-name: dist-files
    secret: # obtainign secret
      some-secret: ${{ secrets.some-secret }}
  print-deploy-result:
    needs: deploy
    runs-on: ubuntu-latest
    steps: 
      - name: Print Deploy Output
        run: echo "${{ needs.deploy.outputs.result }}" # the value from reusable workflow
  report:
    needs: [lint, deploy] # adding evaluation before running this report job
    if: failure() #You can add multiple conditions
    runs-on: ubuntu-latest
    steps:
      - name: Output Information
        run: |
          echo "Something went wrong"
          echo "${{ toJSON(github) }}"
