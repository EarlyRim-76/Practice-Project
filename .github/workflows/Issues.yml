name: Listen Issues Meta Data
on:
  #push: #commented push and issues to trigger the workflow manaully
  workflow_dispatch:
  #issues:
jobs:
  print-metadata:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout Repo
        uses: actions/checkout@v7
      
      - name : Display metadata
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"

